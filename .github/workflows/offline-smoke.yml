name: autoreels-offline-smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deterministic-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install unit-test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Run offline deterministic smoke suite
        env:
          GROQ_API_KEY: ''
          OPENROUTER_API_KEY: ''
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: |
          python -m pytest -q \
            tests/test_autocut.py \
            tests/test_m232_a8.py \
            tests/test_m232_a5.py \
            tests/test_select_validate.py \
            tests/test_config.py \
            tests/test_models.py \
            tests/test_models_m116.py
