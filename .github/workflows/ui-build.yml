name: autoreels-ui-build

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-build.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/ui-build.yml'

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --version && npm --version
      - run: npm ci
      - run: npm run build
