name: autoreels-ui-build

on:
  pull_request:
    branches: [main]
    paths:
      - 'ui/**'
      - 'src/autoreels/orchestr/**'
      - 'tests/ui/**'
      - '.github/workflows/ui-build.yml'
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - 'src/autoreels/orchestr/**'
      - 'tests/ui/**'
      - '.github/workflows/ui-build.yml'

permissions:
  contents: read

jobs:
  typecheck-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node --version && npm --version
      - run: npm ci
      - name: Check generated client types
        run: npm run gen:api && git diff --exit-code -- src/api/types.gen.ts
      - run: npm run build
      - name: Install isolated browser test tool
        run: npm install --prefix "$RUNNER_TEMP/arl-browser" --no-audit --no-fund --save-exact playwright@1.55.0
      - name: Synthetic browser smoke
        env:
          ARL_PLAYWRIGHT: ${{ runner.temp }}/arl-browser/node_modules/playwright
        run: |
          npx --no-install vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/arl-preview.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          node scripts/browser-smoke.cjs
      - name: Synthetic authenticated HTTPS smoke
        env:
          ARL_PLAYWRIGHT: ${{ runner.temp }}/arl-browser/node_modules/playwright
        run: |
          cd ..
          python -m pip install -e '.[dev]' -r ui/requirements.txt
          export ARL_PRIVATE_TEST_ROOT="$RUNNER_TEMP/arl-private-root"
          export ARL_PRIVATE_TEST_CERT="$RUNNER_TEMP/arl-private-cert.pem"
          export ARL_PRIVATE_TEST_KEY="$RUNNER_TEMP/arl-private-key.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' -keyout "$ARL_PRIVATE_TEST_KEY" -out "$ARL_PRIVATE_TEST_CERT" >/dev/null 2>&1
          python tests/ui/private_browser_server.py > "$RUNNER_TEMP/arl-private.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:8766/api/health | grep -qx 401; then break; fi
            sleep 1
          done
          curl -ks -o /dev/null -w '%{http_code}' https://127.0.0.1:8766/api/health | grep -qx 401
          node ui/scripts/private-smoke.cjs
  catalog-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install -e '.[dev]' -r ui/requirements.txt
      - name: API contract and catalog regression
        run: |
          python -m autoreels.orchestr.export_openapi > "$RUNNER_TEMP/arl-openapi.json"
          diff -u ui/openapi.json "$RUNNER_TEMP/arl-openapi.json"
          python -m pytest -q tests/ui/test_projects.py tests/ui/test_reviews.py tests/ui/test_openapi_snapshot.py tests/ui/test_api.py tests/ui/test_private_access.py tests/ui/test_sources_meta.py tests/ui/test_jobs.py tests/ui/test_execution.py tests/ui/test_presets.py tests/ui/test_staged_render.py

  synthetic-ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python -m pip install -e '.[dev]' -r ui/requirements.txt
      - name: Verify test tools
        run: |
          ffmpeg -version
          ffprobe -version
          fc-match 'DejaVu Sans'
      - name: Actual isolated synthetic render
        env:
          GROQ_API_KEY: ''
          OPENROUTER_API_KEY: ''
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
        run: python -m pytest -q -s tests/ui/test_real_staged_render.py
