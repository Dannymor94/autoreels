# Параметры локального рендера ffmpeg. Ноль магических чисел в коде.
# ОБЩИЙ конфиг (в git). Машинные настройки (путь к ffmpeg, кодек энкодера) — НЕ здесь,
# а в render.local.yaml (в .gitignore, накладывается поверх). См. render.local.yaml.example.
# ffmpeg: путь к бинарю. Дефолт — из PATH; машинный путь задавать в render.local.yaml.
ffmpeg: ffmpeg                 # Mac/Linux: ffmpeg из PATH

scale: [1080, 1920]            # целевое вертикальное разрешение 9:16

encoder:
  # Кодек выбирается ПРОФИЛЕМ (кодек+битрейт связаны). Дефолт hevc — вдвое компактнее h264
  # при том же качестве, соцсети (Instagram/TikTok/YouTube) принимают. Профиль — env-параметр
  # (RENDER_PROFILE) или флаг --profile. Кодеки — AMF (системник Windows AMD); Mac-дев без
  # AMF переопределяет кодек через RENDER_ENCODER (libx264/libx265), битрейт профиля остаётся.
  profile: hevc               # активный кодек-профиль (hevc | hevc_hq | h264 | h264_hq | hevc_sw | av1)
  # Диагностика качества: softness на равном битрейте — от аппаратного AMF, а не от 5 Мбит/с
  # (libx265@5M держал 88% резкости референса). Отсюда `quality: quality` (режим кодера AMF,
  # часто важнее битрейта), cqp-профиль и софтверный профиль для избранных клипов.
  profiles:
    hevc:                     # ДЕФОЛТ: компактный, быстрый. + quality-режим AMF против мыла.
      codec: hevc_amf
      bitrate: 5M             # H.265 держит качество на 4–6 Мбит/с
      quality: quality        # AMF: режим качества вместо speed/balanced (важнее битрейта)
      label: "быстро, компактный (дефолт)"
    hevc_hq:                  # лучше качество: высокий битрейт + постоянный QP (размер плавает)
      codec: hevc_amf
      bitrate: 12M
      quality: quality
      rate_control: cqp       # -rc cqp -qp_i 18 -qp_p 20 (качество приоритетно)
      qp: 18
      label: "быстро, лучше качество (крупнее файл)"
    h264:                     # безопасный: универсальная совместимость соцсетей
      codec: h264_amf
      bitrate: 7M             # H.264 нужен выше битрейт (6–8 Мбит/с)
      quality: quality
      label: "быстро, совместимый"
    h264_hq:                  # совместимый + высокое качество (крупный файл)
      codec: h264_amf
      bitrate: 16M
      quality: quality
      label: "быстро, лучше, совместимый (крупный файл)"
    hevc_sw:                  # софтверный libx265: САМЫЙ чёткий по замерам, но МЕДЛЕННЫЙ
      codec: libx265
      bitrate: 5M
      label: "МЕДЛЕННО, максимум качества (для избранных клипов)"
    av1:                      # максимально компактный, экспериментально (медленнее кодирует)
      codec: av1_amf
      bitrate: 4M
      label: "экспериментально, компактно"
  preset: medium              # пресет софтверных libx26x; аппаратный AMF его игнорирует
  cq: 23                      # legacy CRF; в битрейт-режиме на команду НЕ влияет
  # Rate-control под соцсети: ЦЕЛЕВОЙ БИТРЕЙТ → предсказуемый компактный размер файла одним
  # проходом. Главное — работает на AMF, который без rate-control раздувал файлы в разы
  # (отсюда была нужда дожимать HandBrake).
  pix_fmt: yuv420p            # универсальная совместимость соцсетей/плееров (не yuv444)
  faststart: true            # moov-atom в начало файла — соцсети требуют для стрим-старта

audio:
  codec: aac
  bitrate: 128k               # aac 128k — достаточно для соцсетей (было 160k)

# Обработка звука клипа. Порядок фильтров: шумоподавление → нормализация → фейд.
audio_processing:
  # Нормализация громкости (loudnorm) — ГЛАВНОЕ: все клипы к единому -14 LUFS (стандарт
  # соцсетей), чтобы разные записи звучали одинаково громко. Однопроходный: для 30-60с точности
  # достаточно (двухпроходный медленнее, не нужен). Включено по умолчанию.
  loudnorm_enabled: true
  target_lufs: -14.0
  true_peak: -1.5             # потолок истинного пика, дБ
  loudness_range: 11.0
  # Шумоподавление (afftdn) для фонового гула/шипения — ВЫКЛ по умолчанию (агрессивно съедает голос).
  denoise_enabled: false
  denoise_strength: 12.0      # afftdn nr=, дБ
  # Фейд видео+звука в начале/конце (убирает резкий старт). ВЫКЛ по умолчанию; хвост ложится
  # на padding-«воздух» в конце — речь не режется.
  fade_enabled: false
  fade_duration: 0.25
  # Аудио-фейд в конце клипа (ТОЛЬКО звук). Два режима по word-таймингам манифеста:
  # CLEAN (нет следующего слова в хвосте): fade только последних tail_fade_sec — дыхание слышно.
  # INTRUDED (следующее слово в хвосте): fade от (nw_start − intrusion_guard_sec), гасит вторжение.
  tail_fade_sec: 0.35
  intrusion_guard_sec: 0.12
  # Видео-фейд в чёрное в конце клипа, синхронный с аудио tail fade. AFTER субтитров.
  tail_video_fade: true
  tail_video_fade_min_sec: 0.25
  # Микро-фейд на краях аудиосегментов многосегментного клипа (гасит щелчок склейки, без
  # перекрытия — длина звука = длине видео). Только клипы с >1 сегментом. 0 → встык без фейдов.
  audio_edge_fade_sec: 0.01

# Извлечение аудиодорожки под Whisper (cloud/extract_audio.py, ffmpeg -vn).
# mp3 64k mono 16kHz: 8 000 байт/с → 46 мин = ~22 МБ (под лимит Groq 25 МБ).
# PCM 16kHz mono было 32 000 байт/с → предел ~13 мин; mp3 разблокирует 46 мин без чанкинга.
audio_extract:
  sample_rate: 16000
  channels: 1
  codec: libmp3lame
  format: mp3
  bitrate: 64k

# Цветокоррекция — готовые пресеты палитры. Активный выбирается флагом --palette или
# полем palette: в render.local.yaml (машинная настройка). Фильтры встают в цепочку ПОСЛЕ
# crop/scale и ДО субтитров: crop→scale→curves→eq→colortemperature→unsharp→ass→энкодер
# (субтитры накладываются последними и цветокором не затрагиваются).
# curves: shadows/highlights -100..+100 (0=нейтрально; +тени поднимают тёмные, -света
#   приглушают яркие; концы кривой зафиксированы — крайние значения не выбивают детали).
#   Осторожно: подъём теней вытаскивает шум из тёмных участков (телефон в помещении заметит).
# eq: brightness -1..1 (0), contrast 0..2 (1), saturation 0..3 (1), gamma 0.1..10 (1).
# unsharp ВЫКЛ по умолчанию — перебор даёт звон по контурам (соцсети усиливают при рекомпрессии).
#   Держим мягкий luma_amount; unsharp применяется ПОСЛЕДНИМ (резкость по финальной картинке).
# colortemperature: Кельвины, <6500 теплее / >6500 холоднее; null = выкл.
palette: neutral               # активная палитра (neutral | vivid | soft | sharp)
palettes:
  neutral:                     # ДЕФОЛТ: всё по нулям — фильтры вообще не добавляются
    label: "без изменений (дефолт)"
  vivid:                       # живее для соцсетей
    eq: {saturation: 1.15, contrast: 1.10}
    label: "живее: насыщенность +15%, контраст +10% (соцсети)"
  soft:                        # мягче + теплее + приподнятые тени, под talking-head
    eq: {contrast: 0.95, saturation: 1.05}
    curves: {shadows: 10}
    colortemperature: 5400
    label: "мягче + теплее, тени +10 (talking-head)"
  sharp:                       # умеренная резкость + лёгкий контраст
    eq: {contrast: 1.05}
    unsharp: {enabled: true, luma_amount: 0.6}
    label: "умеренный unsharp + лёгкий контраст"

# Фоновая музыка под речь. Порядок аудио: речь → шумоподавление → нормализация → микс с музыкой
# → финальная нормализация (сумма не клиппит). Музыка заметно тише голоса. Короткий трек
# зацикливается, длинный — обрезается по длине клипа; фейд музыки 2с в начале/конце. ВЫКЛ по
# умолчанию. Трек: --music <файл> или music_file здесь (путь относительно music/ или абсолютный).
music:
  enabled: false
  file: null               # трек: имя в music/ или абсолютный путь
  random: false            # случайный трек из music/
  volume: 0.13             # громкость музыки (0..1), тише голоса
  fade_seconds: 2.0        # фейд музыки в начале/конце
  ducking: false           # приглушать музыку под речь (sidechaincompress) — звучит профессиональнее
  final_normalize: true    # финальная нормализация микса (анти-клиппинг)

# Эффект зума (акцент на ключевом моменте). Качество: zoompan сэмплит уже вырезанный
# ПОЛНОРАЗМЕРНЫЙ регион и выводит 1080×1920 (динамический кроп меньшей области), НЕ апскейлит
# готовый кадр — так качество не падает. Схема hook: лёгкий наезд в начале клипа + плавный
# возврат к базовому кадру. ВЫКЛ по умолчанию.
zoom:
  enabled: false
  percent: 8.0             # величина наезда, % (8% = зум до 1.08)
  duration: 0.25           # секунды на наезд и на возврат
  scheme: hook             # hook | none
  hook_seconds: 2.5        # длина hook-жеста от начала клипа (наезд+удержание+возврат)
  fps: 30                  # ignored — рендерер следует fps источника, чтобы не было дрейфа A/V

# Publish sidecars (<reel>.txt and index.md written at render time).
# hashtags_always: fixed tags for every clip of this source (e.g. speaker's topic area).
# hashtags_max: total cap (always + frequency-derived). 0 = no frequency-derived hashtags
#   (manual path: hashtags written by reviewer in d: field; hashtags_always still applied).
hashtags_always: []
hashtags_max: 0

# M1.8: energy-based speech map — off by default (Stage A). Stage B consumers behind this flag.
speech_map: false
# M1.8 speech map parameters. These feed the cache key; changing any param rebuilds the map.
# cut_pause_min_sec: consumer threshold only (does not affect stored map). Regression #568: 0.29s
# gap from voiceless stop closure must be below this threshold so it is never treated as a cut.
speech_map_cfg:
  frame_sec: 0.01
  noise_percentile: 10.0
  headroom_db: 15.0
  min_silence_sec: 0.05
  pause_min_sec: 0.15
  min_edge_dist: 0.060
  untranscribed_min_sec: 0.100
  cut_pause_min_sec: 0.35   # kept for backward compat; no longer used in tail rule
  tail_pad_sec: 1.50        # max air after audible_end: end = min(N − onset_margin, ae + tail_pad)
  onset_margin_sec: 0.06    # guard before next speech onset
  fade_keep_sec: 0.20       # unfaded air after ae before the fade begins
  own_tail_window_sec: 0.30 # own-tail filter: interval must start within this after ae
  own_tail_short_sec: 0.25  # own-tail filter: interval must be shorter than this (duration rule)
  own_tail_gap_min_sec: 0.10 # own-tail filter: gap from interval end to next word
  own_tail_t1_margin_sec: 0.15 # Whisper t1 hint: interval contains or ends within t1+margin → own tail

# M1.8 Stage B consumer 2: synthetic tail. Off by default (enabled: false = identical output).
synthetic_tail_cfg:
  enabled: false
  min_room_sec: 0.60    # room < this triggers synthetic tail
  keep_sec: 0.15        # real source kept after audible_end (no fade on speech)
  tail_sec: 1.0         # synthetic tail duration
  fade_sec: 0.60        # fade-out at end of tail
  push: false           # slow push-in zoom (optional)

# M1.7 step 1: two-shot mode (wide/close crop within a clip). Off by default.
# When off, render is byte-identical to M1.6 output (or same argv for non-deterministic encoders).
two_shot: false
two_shot_xfade: false
close_shot_scale: 1.25
close_shot_anchor_y: 0.35
# M1.7 step 1b: automatic shot alternation. Requires two_shot: true. Off by default.
two_shot_auto: false
two_shot_max_shot_sec: 14.0  # max duration for any shot (wide OR close); two_shot_max_wide_sec is an alias
two_shot_min_sec: 2.5        # minimum shot duration; suppress switch that would go shorter
two_shot_min_middle_sec: 4.0  # A-B-A middle span shorter than this is merged into neighbours
# M1.7 step 3: beat-clip shot rule.  Shot changes ONLY at jump seams (source gap > 2 s or
# backward) and cold open.  No two_shot_auto ci-splits inside a beat.
# c: on any sentence in a beat block decides the WHOLE block's shot.
beat_clip_shots_only_at_seams: true
# M1.7 step 1d: transitions at ci shot-changes and same-shot seams. Off by default.
shot_transition: cut         # "cut" only; punch (crop-animation) is a future task
same_shot_dissolve_frames: 4 # dissolve on same-shot seams (0 = disabled; uses video_xfade_sec fallback)

# M1.7 step 2: sentence-scoped keyword highlighting in subtitles. Off by default.
# When off, render is byte-identical to pre-M1.7-step-2 output even if k: fields present.
subtitle_keywords: false

subtitles:
  # ASS-стиль из PROJECT_GUIDE §визуальная часть. Белый, жирный, CAPS, нижняя треть.
  font: Montserrat
  font_size: 72
  margin_v: 300               # сажает текст в нижнюю треть (зона над UI платформы)
  words_per_line: [2, 4]      # группировка поп-апа по словам (\k)
  # font_dir — путь к шрифтам для ffmpeg (fontsdir). Заполняется под машину рендера.
  font_dir: null
