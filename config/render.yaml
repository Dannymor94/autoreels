# Параметры локального рендера ffmpeg. Ноль магических чисел в коде.
# ОБЩИЙ конфиг (в git). Машинные настройки (путь к ffmpeg, кодек энкодера) — НЕ здесь,
# а в render.local.yaml (в .gitignore, накладывается поверх). См. render.local.yaml.example.
# ffmpeg: путь к бинарю. Дефолт — из PATH; машинный путь задавать в render.local.yaml.
ffmpeg: ffmpeg                 # Mac/Linux: ffmpeg из PATH

scale: [1080, 1920]            # целевое вертикальное разрешение 9:16

encoder:
  # Кодек выбирается ПРОФИЛЕМ (кодек+битрейт связаны). Дефолт hevc — вдвое компактнее h264
  # при том же качестве, соцсети (Instagram/TikTok/YouTube) принимают. Профиль — env-параметр
  # (RENDER_PROFILE) или флаг --profile. Кодеки — AMF (системник Windows AMD); Mac-дев без
  # AMF переопределяет кодек через RENDER_ENCODER (libx264/libx265), битрейт профиля остаётся.
  profile: hevc               # активный кодек-профиль (hevc | hevc_hq | h264 | h264_hq | hevc_sw | av1)
  # Диагностика качества: softness на равном битрейте — от аппаратного AMF, а не от 5 Мбит/с
  # (libx265@5M держал 88% резкости референса). Отсюда `quality: quality` (режим кодера AMF,
  # часто важнее битрейта), cqp-профиль и софтверный профиль для избранных клипов.
  profiles:
    hevc:                     # ДЕФОЛТ: компактный, быстрый. + quality-режим AMF против мыла.
      codec: hevc_amf
      bitrate: 5M             # H.265 держит качество на 4–6 Мбит/с
      quality: quality        # AMF: режим качества вместо speed/balanced (важнее битрейта)
      label: "быстро, компактный (дефолт)"
    hevc_hq:                  # лучше качество: высокий битрейт + постоянный QP (размер плавает)
      codec: hevc_amf
      bitrate: 12M
      quality: quality
      rate_control: cqp       # -rc cqp -qp_i 18 -qp_p 20 (качество приоритетно)
      qp: 18
      label: "быстро, лучше качество (крупнее файл)"
    h264:                     # безопасный: универсальная совместимость соцсетей
      codec: h264_amf
      bitrate: 7M             # H.264 нужен выше битрейт (6–8 Мбит/с)
      quality: quality
      label: "быстро, совместимый"
    h264_hq:                  # совместимый + высокое качество (крупный файл)
      codec: h264_amf
      bitrate: 16M
      quality: quality
      label: "быстро, лучше, совместимый (крупный файл)"
    hevc_sw:                  # софтверный libx265: САМЫЙ чёткий по замерам, но МЕДЛЕННЫЙ
      codec: libx265
      bitrate: 5M
      label: "МЕДЛЕННО, максимум качества (для избранных клипов)"
    av1:                      # максимально компактный, экспериментально (медленнее кодирует)
      codec: av1_amf
      bitrate: 4M
      label: "экспериментально, компактно"
  preset: medium              # пресет софтверных libx26x; аппаратный AMF его игнорирует
  cq: 23                      # legacy CRF; в битрейт-режиме на команду НЕ влияет
  # Rate-control под соцсети: ЦЕЛЕВОЙ БИТРЕЙТ → предсказуемый компактный размер файла одним
  # проходом. Главное — работает на AMF, который без rate-control раздувал файлы в разы
  # (отсюда была нужда дожимать HandBrake).
  pix_fmt: yuv420p            # универсальная совместимость соцсетей/плееров (не yuv444)
  faststart: true            # moov-atom в начало файла — соцсети требуют для стрим-старта

audio:
  codec: aac
  bitrate: 128k               # aac 128k — достаточно для соцсетей (было 160k)

# Обработка звука клипа. Порядок фильтров: шумоподавление → нормализация → фейд.
audio_processing:
  # Нормализация громкости (loudnorm) — ГЛАВНОЕ: все клипы к единому -14 LUFS (стандарт
  # соцсетей), чтобы разные записи звучали одинаково громко. Однопроходный: для 30-60с точности
  # достаточно (двухпроходный медленнее, не нужен). Включено по умолчанию.
  loudnorm_enabled: true
  target_lufs: -14.0
  true_peak: -1.5             # потолок истинного пика, дБ
  loudness_range: 11.0
  # Шумоподавление (afftdn) для фонового гула/шипения — ВЫКЛ по умолчанию (агрессивно съедает голос).
  denoise_enabled: false
  denoise_strength: 12.0      # afftdn nr=, дБ
  # Фейд видео+звука в начале/конце (убирает резкий старт). ВЫКЛ по умолчанию; хвост ложится
  # на padding-«воздух» в конце — речь не режется.
  fade_enabled: false
  fade_duration: 0.25

# Извлечение аудиодорожки под Whisper (cloud/extract_audio.py, ffmpeg -vn).
# mp3 64k mono 16kHz: 8 000 байт/с → 46 мин = ~22 МБ (под лимит Groq 25 МБ).
# PCM 16kHz mono было 32 000 байт/с → предел ~13 мин; mp3 разблокирует 46 мин без чанкинга.
audio_extract:
  sample_rate: 16000
  channels: 1
  codec: libmp3lame
  format: mp3
  bitrate: 64k

# Цветокоррекция — готовые пресеты палитры. Активный выбирается флагом --palette или
# полем palette: в render.local.yaml (машинная настройка). Фильтры встают в цепочку ПОСЛЕ
# crop/scale и ДО субтитров: crop→scale→eq/unsharp→ass→энкодер (субтитры остаются чистыми).
# eq: brightness -1..1 (0), contrast 0..2 (1), saturation 0..3 (1), gamma 0.1..10 (1).
# unsharp ВЫКЛ по умолчанию — перебор даёт звон по контурам (соцсети усиливают при рекомпрессии).
# colortemperature: Кельвины, <6500 теплее / >6500 холоднее; null = выкл.
palette: neutral               # активная палитра (neutral | vivid | soft | sharp)
palettes:
  neutral:                     # ДЕФОЛТ: всё по нулям — картинка не меняется
    label: "без изменений (дефолт)"
  vivid:                       # живее для соцсетей
    eq: {saturation: 1.15, contrast: 1.10}
    label: "живее: насыщенность +15%, контраст +10% (соцсети)"
  soft:                        # мягче + теплее, под talking-head
    eq: {contrast: 0.95, saturation: 1.05}
    colortemperature: 5400
    label: "мягче + теплее (talking-head)"
  sharp:                       # умеренная резкость + лёгкий контраст
    eq: {contrast: 1.05}
    unsharp: {enabled: true, luma_amount: 0.6}
    label: "умеренный unsharp + лёгкий контраст"

# Эффект зума (акцент на ключевом моменте). Качество: zoompan сэмплит уже вырезанный
# ПОЛНОРАЗМЕРНЫЙ регион и выводит 1080×1920 (динамический кроп меньшей области), НЕ апскейлит
# готовый кадр — так качество не падает. Схема hook: лёгкий наезд в начале клипа + плавный
# возврат к базовому кадру. ВЫКЛ по умолчанию.
zoom:
  enabled: false
  percent: 8.0             # величина наезда, % (8% = зум до 1.08)
  duration: 0.4            # секунды на наезд и на возврат
  scheme: hook             # hook | none
  hook_seconds: 2.5        # длина hook-жеста от начала клипа (наезд+удержание+возврат)
  fps: 30                  # выходной fps зум-клипа (zoompan форсит постоянный fps)

subtitles:
  # ASS-стиль из PROJECT_GUIDE §визуальная часть. Белый, жирный, CAPS, нижняя треть.
  font: Montserrat
  font_size: 72
  margin_v: 300               # сажает текст в нижнюю треть (зона над UI платформы)
  words_per_line: [2, 4]      # группировка поп-апа по словам (\k)
  # font_dir — путь к шрифтам для ffmpeg (fontsdir). Заполняется под машину рендера.
  font_dir: null
