# R0 — конфиг выбора моментов. Всё, что вынесено из кода (R0_SPEC).
source_kind: lecture           # "lecture" | "interview"
duration_preset: shorts        # shorts | reels | tiktok
model: qwen/qwen3.8-27b        # LLM R0 на Groq (основная, сильнее по качеству). Имена моделей
                               # у Groq протухают молча (qwen3-32b → 404, затем qwen3.6-27b снята).
                               # Сверять: `arl models` — покажет живые списки обоих провайдеров
                               # и пометит настроенные.
openrouter_model: nvidia/nemotron-3-super-120b-a12b:free  # OpenRouter: второй провайдер
                                      # для распределения R0-нагрузки (обход дневной квоты Groq).
                                      # Формат: 'vendor/model:free'. Наличие модели в каталоге
                                      # НЕ означает доступность: часть бесплатных отдаётся только
                                      # по своему ключу провайдера и отвергается пулом с
                                      # 'is_byok:false' (так отвалились обе Gemma).
                                      # `arl models` пингует настроенные и показывает это.
                                      # Добавить OPENROUTER_API_KEY= в .env (бесплатно);
                                      # без ключа — только Groq.
openrouter_fallback_models:           # запасные модели: при 404/блокировке пробуем по порядку.
  - nvidia/nemotron-3-ultra-550b-a55b:free   # пингом не проверены — прогнать `arl models`
  - thinkingmachines/inkling:free
provider_strategy: adaptive    # распределение R0-чанков между Groq и OpenRouter:
                               #   adaptive     — Groq основной; слив на OpenRouter только под
                               #                  троттлом, возврат когда Groq остыл. Качество
                               #                  не плавает (слабая модель лишь под нагрузкой).
                               #   round_robin  — чередовать поровну. Макс. пропускная, НО
                               #                  половина чанков на слабую модель (компромисс
                               #                  качества — включать осознанно после стоп-чека).
min_score: 65
max_output_tokens: 900   # Groq free-tier OTPM = 1000 tok/min (не в заголовках, рулит max_tokens).
                         # Держать < 1000; 900 = запас ~10%. Реальный R0-ответ обычно 200-600 tok.
                         # Платный Developer-тир снимает OTPM — тогда поднимать до ~4000.
min_meaningful_sec: 18         # пост-фильтр длины: сегменты короче — снять (законченной
                               # мысли не бывает в <18с). ВЫШЕ min пресета (15) — иначе no-op.
                               # Крутить здесь: строже → 20-22; мягче → 16.
min_clip_duration: 8           # ПОСТ-SNAP минимум длины клипа. Отличается от min_meaningful_sec
                               # (пре-snap): snap+padding могут схлопнуть хороший 18с момент
                               # до 1с. 8с — абсолютный минимум осмысленного контента в ролике;
                               # ниже — явная схлопка, а не реальный момент. Перед отбросом
                               # код пробует расширить клип до ближайшей границы фразы.
                               # Крутить: строже → 10с; мягче → 5с. Ниже 4с — всегда огрызок.
max_reels: 20                  # top-N после ранжирования по score. null = все прошедшие порог.
candidate_multiplier: 1.75     # over-generation: цель кандидатов = max_reels * это (~35 при 20).
                               # Копим с запасом, ранжируем по score, режем top-N; отсев — в
                               # <манифест>.discarded.json рядом с манифестом.
chunk_tokens: 3500
chunk_overlap_sec: 60
dedup_overlap_threshold: 0.6
dangling_words:                # блоклист ПЕРВОГО слова клипа (проверка dangling-start, post-snap;
                               # регистр не важен). К слову, стоящему сразу после терминального
                               # знака, не применяется — там граница предложения важнее.
  - поэтому
  - потому
  - любом
  - однако
  - ведь
  - значит
  - тоже
  - также
sentence_pause_sec: 0.35        # склейка предложений: пауза > порога рвёт предложение
                                # (Whisper на русском роняет пунктуацию → порог занижен).
                                # тот же порог = «пауза» при snap границ к словам (R4-min)
tail_sec: 0.3                   # хвост при snap к границе слова (технический, не трогать)
tail_pad_sec: 0.7               # «воздух» после последнего слова клипа (apply_padding, post-snap)
lead_pad_sec: 0.3               # заход перед первым словом клипа (apply_padding, post-snap)
snap_window_sec: 1.5            # окно поиска границы слова/паузы при snap (±сек от LLM-границы)
max_start_repair_sec: 10.0      # окно поиска вперёд при ремонте висящего начала: сначала первое
                                # слово после терминального знака (.?!), иначе слово с заглавной.
                                # Ремонт ВМЕСТО отбрасывания — иначе теряются сильные кандидаты
                                # из-за одной строчной буквы (было 16 отсевов из 33).
# Snap «до завершения мысли»: конец клипа тянется до конца предложения (пунктуация Whisper) или
# длинной паузы, пока (end-start) < max_duration; не обрывать на союзе/предлоге и микропаузе;
# не влезло в лимит → откат к последней целой фразе.
# Fix 1 (video review): плотность речи на ГОТОВОМ клипе (после merge/snap/padding). Клип ниже
# порога сперва пробуют срезать по единой паузе ≥ split_gap (оставить длинную половину), иначе
# снять с причиной low_speech_density. r08 (интервью): 54.7с, 72.7% речи, пауза-раздумье 14.6с.
final_speech_density_min: 0.80        # min доля времени клипа под речью (0 = проверка выключена)
speech_density_split_gap_sec: 3.0     # единая пауза ≥ этого → срез клипа по ней, длинную половину
min_pause_for_phrase_end: 1.5   # пауза > порога = конец мысли. Было 0.6 → рвало на thinking-
                                # паузах (спикер подбирает слово: «и это.. [0.7-1.2с] ..самая»).
                                # 1.5 = между худшим обрывом (1.12с) и лучшим верным (2.06с).
                                # Крутить под спикера: быстрее речь → меньше; медленнее → больше.
max_micro_pause: 0.4            # пауза < порога = микропауза (никогда не конец мысли)
max_end_search_sec: 12.0        # окно поиска конца предложения от r0_end (сек); за окном →
                                # пауза-фолбэк в том же окне; не найдено — r0_end + tail.
                                # Ограничивает дрейф end. Крутить: меньше → жёстче к LLM-границе.
# Предпочтение длинного клипа: грамматически конец бывает раньше, чем спикер закончил мысль,
# а запас времени есть. Если клип < ratio·max_duration — тянуть до следующей чистой границы
# предложения, максимум +max_extra_sentences. ratio=0 отключает. Проверяется resnap'ом мгновенно.
prefer_longer_below_ratio: 0.7  # <70% лимита (<63с при 90с) → продлить до следующего конца фразы
max_extra_sentences: 2          # но не более +2 предложений (чтобы не уйти в другую тему)
hanging_words:                 # висячие слова: применяется к ПЕРВОМУ и ПОСЛЕДНЕМУ слову клипа
  - и
  - а
  - но
  - что
  - это
  - как
  - в
  - на
  - потому
  - чтобы
  - если
  - когда
  - то
  - есть
  - вот
  - я
  - потом
  - тогда
  - здесь
  - сейчас
host_affirmations:             # самостоятельные реплики-поддакивания: срезать с хвоста клипа
                               # независимо от того, кто определён как говорящий
  - здорово
  - понятно
  - отлично
  - хорошо
max_sentence_buffer_sec: 30     # запас сверх max_duration пресета: эффективный порог
                                # дробления = max_duration + запас (shorts ≈ 120с). Гиганты
                                # режутся по самым длинным внутренним паузам; легальные
                                # моменты 30–90с остаются целыми (см. R0Config.max_sentence_sec)
too_long_policy: trim              # trim | drop | keep (что делать с сегментами >max_duration).
                                   # trim режет НАЧАЛО, не конец: развязка мысли живёт в конце,
                                   # завязку зритель догоняет по контексту.
title_style: clickbait_ru      # рамка кликбейт-заголовка (R0_SPEC §4)
language: ru                   # язык вывода LLM
prompt_language: en            # system-промпт на английском (крепче grounding)

# Пресеты длины (сек) — PROJECT_GUIDE / R0_SPEC §3. Код-валидатор ставит too_long/too_short.
# 90с: площадки допускают до 180с (Shorts и Reels — 3 мин), но вовлечённость падает раньше,
# а Instagram не рекомендует Reels длиннее 3 мин новой аудитории.
presets:
  shorts: { min: 15, max: 90 }
  reels:  { min: 15, max: 90 }
  tiktok: { min: 15, max: 180 }

# M1.6 stage 2: deterministic pre-filter — drops obviously-not-a-clip blocks before LLM sees them.
# Every dropped block goes to a .blocks.dropped.json sidecar with its reason and first 8 words.
# A filter that removes a good block is worse than one that lets junk through (stage 3 can rank it down).
blocks_filter:
  head_skip_sec: 30       # drop blocks whose midpoint falls in the first N seconds (greetings)
  tail_skip_sec: 30       # drop blocks whose midpoint falls in the last N seconds (sign-offs)
  speech_density_min: 0.4 # drop if spoken_words_time / wall_time < threshold (guided practice silences)
  repetition_unique_ratio_min: 0.3  # drop if unique_words/total_words < threshold (Whisper loops)
  artefact_markers:       # case-insensitive substrings that identify Whisper training-data hallucinations
    - "субтитры создавал"
    - "субтитры созданы"   # variant found in PXL: "Субтитры созданы сообществом Авиакатастроф"
    - "субтитры сделал"
    - "редактор субтитров"
    - "続きは"            # Japanese credit string Whisper sometimes hallucinates
    - "字幕"              # Chinese subtitle credit
  promo_keywords:         # organisational / promotional talk — case-insensitive substring match
    - "приходите на"      # street addresses ("приходите на Фурмановскую")
    - "перерыв"
    - "включите звук"
    - "слышно меня"
    - "запись идёт"
    - "подписывайтесь"
  # Price pattern (\d+\s*рубл) is matched by code — no need to list here.
  signoff_phrases:        # dropped when phrase opens a sentence (block start or after .!?…)
    - "спасибо, что были"
    - "спасибо за внимание"
    - "до встречи"
    - "всем пока"
    - "на этом всё"
    - "до новых встреч"
    - "здравствуйте"
    - "добрый день"
    - "рад вас видеть"
    - "давайте начнём"

# M1.6 stage 3: heuristic pre-scoring. Weights are tunable; final model verdict still wins.
# A filter that buries a good block is worse than one that lets junk through — tune conservatively.
block_scoring:
  w_duration: 20.0        # bell-curve peak inside sweet_spot_min..sweet_spot_max
  w_ends_sentence: 10.0   # block ends on terminal punctuation
  w_opens_sentence: 10.0  # first word is not a dangling opener
  w_question: 8.0         # block contains an interrogative sentence
  w_contrarian: 12.0      # block contains a hook/contrarian marker
  w_lexical: 8.0          # lexical richness: unique_words / total_words
  w_dangling: 10.0        # penalty: many pronouns/demonstratives in first sentence
  w_speaker_change: 20.0  # penalty: has_internal_speaker_change
  w_density_penalty: 8.0  # penalty: speech density < 0.5 (near-silence); >0.95 is normal speech
  min_sec: 18.0           # score = 0 at and below this (matches min_meaningful_sec)
  sweet_spot_min: 30.0    # duration ramp reaches 1.0 here
  sweet_spot_max: 60.0    # starts falling off; hits 0 at sweet_max + (sweet_max - sweet_min)
  top_k_per_chunk: 8      # keep this many blocks per time window
  chunk_window_sec: 300.0 # time window size for per-chunk top-K filtering (≈5 min)
  contrarian_markers:
    - "на самом деле"
    - "наоборот"
    - "а вот и нет"
    - "что интересно"
    - "однако"
    - "но дело в том"
    - "интересно то"
    - "всё дело в"
    - "парадокс в том"
    - "на самом же деле"
  bad_open_words:         # conjunctions + pronouns + demonstratives that signal dangling context
    # "а" excluded: Russian host-question opener "А когда/А бывало ли" is a valid standalone start
    - "и"
    - "из"
    - "но"
    - "или"
    - "поэтому"
    - "потому"
    - "однако"
    - "ведь"
    - "значит"
    - "тоже"
    - "также"
    - "зато"
    - "впрочем"
    - "итак"
    - "следовательно"
    - "таким"
    - "он"
    - "она"
    - "они"
    - "оно"
    - "его"
    - "её"
    - "их"
    - "им"
    - "ей"
    - "тот"
    - "та"
    - "те"
    - "этот"
    - "эта"
    - "эти"
    - "этим"
  # 3rd-person pronouns and demonstratives for dangling_reference density check only
  # (conjunctions excluded — they appear normally mid-sentence and inflate the ratio)
  dangling_pronouns:
    - "он"
    - "она"
    - "они"
    - "оно"
    - "его"
    - "её"
    - "их"
    - "им"
    - "ей"
    - "тот"
    - "та"
    - "те"
    - "этот"
    - "эта"
    - "эти"
    - "этим"

# Пути к рантайм-промптам R0 (не хардкод в коде — берутся отсюда).
prompts:
  system: prompts/r0_system.md
  fewshot: prompts/r0_fewshot.json

# Чанкинг: Whisper-чанкинг аудио + R0-чанкинг транскрипта. Оба реализованы и работают.
chunking:
  enabled: true
  whisper_chunk_duration_sec: 600      # 10 мин на чанк
  whisper_threshold_minutes: 15        # порог «чанкить» по длительности
  whisper_threshold_bytes: 20971520    # 20 МБ — второй гард по размеру аудио
  silence_window_sec: 30               # окно VAD поиска тишины вокруг target-границы (±сек)
  silence_threshold_db: -40            # порог silencedetect
  r0_chunk_tokens: 1200                # токены на R0-чанк транскрипта. НАМЕРЕННО МЕЛКО — это не
                                       # экономия входа: при OTPM=1000 ответ обрезан примерно на
                                       # трёх моментах, поэтому урожай определяется ЧИСЛОМ
                                       # запросов, а не размером чанка. Крупные чанки = те же
                                       # 3 момента с бо́льшего куска речи = меньше клипов
                                       # (проверено: 4000 → 4 рилса, 1200 → 7 на той же лекции).
                                       # Вход (8000 TPM) ограничением НЕ является: пробник прошёл
                                       # prompt 4700 + max_tokens 8192.
                                       # После перехода на платный тир поднимать вместе с
                                       # max_output_tokens.
  r0_overlap_tokens: 300               # перекрытие R0-чанков (≈60с речи)
  r0_chunk_delay_sec: 2.0              # пауза между R0-чанками; темп сверх этого держит пейсер
                                       # по заголовкам x-ratelimit-*
  dedup_overlap_ratio: 0.6             # порог дедупа рилов из разных R0-чанков
  fail_fast: false                     # false → продолжать при провале одного чанка