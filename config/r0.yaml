# R0 — конфиг выбора моментов. Всё, что вынесено из кода (R0_SPEC).
source_kind: lecture           # "lecture" | "interview"
host_turn_min_pause: 0.7       # pause (sec) before a sentence to count it as a host turn (interview)
duration_preset: shorts        # shorts | reels | tiktok
model: qwen/qwen3.8-27b        # LLM R0 на Groq (основная, сильнее по качеству). Имена моделей
                               # у Groq протухают молча (qwen3-32b → 404, затем qwen3.6-27b снята).
                               # Сверять: `arl models` — покажет живые списки обоих провайдеров
                               # и пометит настроенные.
openrouter_model: nvidia/nemotron-3-super-120b-a12b:free  # OpenRouter: второй провайдер
                                      # для распределения R0-нагрузки (обход дневной квоты Groq).
                                      # Формат: 'vendor/model:free'. Наличие модели в каталоге
                                      # НЕ означает доступность: часть бесплатных отдаётся только
                                      # по своему ключу провайдера и отвергается пулом с
                                      # 'is_byok:false' (так отвалились обе Gemma).
                                      # `arl models` пингует настроенные и показывает это.
                                      # Добавить OPENROUTER_API_KEY= в .env (бесплатно);
                                      # без ключа — только Groq.
openrouter_fallback_models:           # запасные модели: при 404/блокировке пробуем по порядку.
  - nvidia/nemotron-3-ultra-550b-a55b:free   # пингом не проверены — прогнать `arl models`
  - thinkingmachines/inkling:free
provider_strategy: adaptive    # распределение R0-чанков между Groq и OpenRouter:
                               #   adaptive     — Groq основной; слив на OpenRouter только под
                               #                  троттлом, возврат когда Groq остыл. Качество
                               #                  не плавает (слабая модель лишь под нагрузкой).
                               #   round_robin  — чередовать поровну. Макс. пропускная, НО
                               #                  половина чанков на слабую модель (компромисс
                               #                  качества — включать осознанно после стоп-чека).
min_score: 65
max_output_tokens: 900   # Groq free-tier OTPM = 1000 tok/min (не в заголовках, рулит max_tokens).
                         # Держать < 1000; 900 = запас ~10%. Реальный R0-ответ обычно 200-600 tok.
                         # Платный Developer-тир снимает OTPM — тогда поднимать до ~4000.
min_meaningful_sec: 18         # пост-фильтр длины: сегменты короче — снять (законченной
                               # мысли не бывает в <18с). ВЫШЕ min пресета (15) — иначе no-op.
                               # Крутить здесь: строже → 20-22; мягче → 16.
min_clip_duration: 8           # ПОСТ-SNAP минимум длины клипа. Отличается от min_meaningful_sec
                               # (пре-snap): snap+padding могут схлопнуть хороший 18с момент
                               # до 1с. 8с — абсолютный минимум осмысленного контента в ролике;
                               # ниже — явная схлопка, а не реальный момент. Перед отбросом
                               # код пробует расширить клип до ближайшей границы фразы.
                               # Крутить: строже → 10с; мягче → 5с. Ниже 4с — всегда огрызок.
max_reels: 20                  # top-N после ранжирования по score. null = все прошедшие порог.
candidate_multiplier: 1.75     # over-generation: цель кандидатов = max_reels * это (~35 при 20).
                               # Копим с запасом, ранжируем по score, режем top-N; отсев — в
                               # <манифест>.discarded.json рядом с манифестом.
chunk_tokens: 3500
chunk_overlap_sec: 60
dedup_overlap_threshold: 0.6
dangling_words:                # блоклист ПЕРВОГО слова клипа (проверка dangling-start, post-snap;
                               # регистр не важен). К слову, стоящему сразу после терминального
                               # знака, не применяется — там граница предложения важнее.
  - поэтому
  - потому
  - любом
  - однако
  - ведь
  - значит
  - тоже
  - также
sentence_pause_sec: 0.35        # склейка предложений: пауза > порога рвёт предложение
                                # (Whisper на русском роняет пунктуацию → порог занижен).
                                # тот же порог = «пауза» при snap границ к словам (R4-min)
tail_sec: 0.3                   # хвост при snap к границе слова (технический, не трогать)
tail_pad_sec: 1.5               # «воздух» после последнего слова клипа (apply_padding, post-snap)
lead_pad_sec: 0.3               # заход перед первым словом клипа (apply_padding, post-snap)
snap_window_sec: 1.5            # окно поиска границы слова/паузы при snap (±сек от LLM-границы)
max_start_repair_sec: 10.0      # окно поиска вперёд при ремонте висящего начала: сначала первое
                                # слово после терминального знака (.?!), иначе слово с заглавной.
                                # Ремонт ВМЕСТО отбрасывания — иначе теряются сильные кандидаты
                                # из-за одной строчной буквы (было 16 отсевов из 33).
# Snap «до завершения мысли»: конец клипа тянется до конца предложения (пунктуация Whisper) или
# длинной паузы, пока (end-start) < max_duration; не обрывать на союзе/предлоге и микропаузе;
# не влезло в лимит → откат к последней целой фразе.
# Fix 1 (video review): плотность речи на ГОТОВОМ клипе (после merge/snap/padding). Клип ниже
# порога сперва пробуют срезать по единой паузе ≥ split_gap (оставить длинную половину), иначе
# снять с причиной low_speech_density. r08 (интервью): 54.7с, 72.7% речи, пауза-раздумье 14.6с.
final_speech_density_min: 0.80        # min доля времени клипа под речью (0 = проверка выключена)
speech_density_split_gap_sec: 3.0     # единая пауза ≥ этого → срез клипа по ней, длинную половину
# Целевая длина блока: на мягкой границе (конец предложения без паузы — спикер продолжил) блок
# НЕ закрывается, пока не набрал block_target_sec; на жёсткой (пауза/абзац/смена говорящего) —
# всегда. Аудит: медиана блоков 22с при потолке 90, 88-91% границ мягкие → тянем до ~40с.
block_target_sec: 40            # цель длины блока сегментации (M1.6)
min_pause_for_phrase_end: 1.5   # пауза > порога = конец мысли. Было 0.6 → рвало на thinking-
                                # паузах (спикер подбирает слово: «и это.. [0.7-1.2с] ..самая»).
                                # 1.5 = между худшим обрывом (1.12с) и лучшим верным (2.06с).
                                # Крутить под спикера: быстрее речь → меньше; медленнее → больше.
review_pause_from_map: true   # M98 (M1.8 потребитель 7): ⏸N.N в выгрузке для разметки — пауза на слух (карта речи /
                              # выравнивание), а не зазор Whisper (нулевой, отрицательный, перекрытый на части материала)
max_micro_pause: 0.4            # пауза < порога = микропауза (никогда не конец мысли)
max_end_search_sec: 12.0        # окно поиска конца предложения от r0_end (сек); за окном →
                                # пауза-фолбэк в том же окне; не найдено — r0_end + tail.
                                # Ограничивает дрейф end. Крутить: меньше → жёстче к LLM-границе.
end_repair_max_extend_sec: 6.0  # _repair_end: максимальный прирост к reel.end при продлении;
# Предпочтение длинного клипа: грамматически конец бывает раньше, чем спикер закончил мысль,
# а запас времени есть. Если клип < ratio·max_duration — тянуть до следующей чистой границы
# предложения, максимум +max_extra_sentences. ratio=0 отключает. Проверяется resnap'ом мгновенно.
prefer_longer_below_ratio: 0.7  # <70% лимита (<63с при 90с) → продлить до следующего конца фразы
max_extra_sentences: 2          # но не более +2 предложений (чтобы не уйти в другую тему)
hanging_end_words:             # клип НЕ должен ЗАКАНЧИВАТЬСЯ на этих словах (мысль повисает)
  - и
  - а
  - но
  - что
  - это
  - как
  - в
  - на
  - потому
  - чтобы
  - если
  - когда
  - то
  - вот
  - я
  - потом
  - тогда
  - здесь
  - сейчас
hanging_start_words:           # клип НЕ должен НАЧИНАТЬСЯ на этих словах (отсылка к тому, что до
                               # клипа). Короче end-списка: «Если…»/«Когда…»/«Я…» — нормальные
                               # начала. Матчинг однословный — «то есть»/«так что» не ловятся.
  - и
  - а
  - но
  - поэтому
  - потому
host_affirmations:             # самостоятельные реплики-поддакивания: срезать с хвоста клипа
                               # независимо от того, кто определён как говорящий
  - здорово
  - понятно
  - отлично
  - хорошо
max_sentence_buffer_sec: 30     # запас сверх max_duration пресета: эффективный порог
                                # дробления = max_duration + запас (shorts ≈ 120с). Гиганты
                                # режутся по самым длинным внутренним паузам; легальные
                                # моменты 30–90с остаются целыми (см. R0Config.max_sentence_sec)
too_long_policy: trim              # trim | drop | keep (что делать с сегментами >max_duration).
                                   # trim режет НАЧАЛО, не конец: развязка мысли живёт в конце,
                                   # завязку зритель догоняет по контексту.
title_style: clickbait_ru      # рамка кликбейт-заголовка (R0_SPEC §4)
language: ru                   # язык вывода LLM
prompt_language: en            # system-промпт на английском (крепче grounding)

# Пресеты длины (сек) — PROJECT_GUIDE / R0_SPEC §3. Код-валидатор ставит too_long/too_short.
# 90с: площадки допускают до 180с (Shorts и Reels — 3 мин), но вовлечённость падает раньше,
# а Instagram не рекомендует Reels длиннее 3 мин новой аудитории.
presets:
  shorts: { min: 15, max: 90 }
  reels:  { min: 15, max: 90 }
  tiktok: { min: 15, max: 180 }
manual_max_duration_sec: 180  # ceiling for human merges (source span; platforms permit up to 3 min)
beat_gap_sec: 0.25  # gap between reordered beats (seconds)
speed: 1.0                    # default playback speed (1.0-1.3); auto-applied when clip exceeds preset

# Deterministic filler removal inside a chosen span (manual/edit path). Each removal becomes a gap
# between playback segments. Per-clip review marker f:0/f:1 > command --filler/--no-filler > this.
filler_removal:
  enabled: true
  filler_words: [ну, вот, как бы, наверное, значит, типа, короче]
  pause_shorten_sec: 0.8       # silence longer than this is shortened…
  pause_residual_sec: 0.25     # …to this residual (kept, not removed — no breathlessness)
  max_removed_share: 0.25      # never remove more than this share of the span
# Trailing "pure wind-down" sentences dropped when the review gives no explicit end (e:).
wind_down_phrases: ["наверное, как-то так", "вот", "да", "понятно", "как-то так", "ну вот"]

# Word-level Whisper credit-hallucination patterns. Consecutive words matching any phrase
# (case-insensitive, punctuation-stripped) are removed at transcript load time.
credit_word_patterns:
  - "Субтитры создавал"
  - "Субтитры делал"
  - "Редактор субтитров"
  - "DimaTorzok"
  - "Продолжение следует"

# Cold open (Part 5): a hook sentence (h:N) longer than this is refused with a warning.
hook_max_sec: 6.0
# Hook replay position rule: fraction of body duration at or after which the hook sentence stays
# in the body (replays). Default 0.5 = second half. h:N! forces keep; h:N- forces remove.
hook_replay_min_pos: 0.5

# docs/REEL_SPEC.md — manual (human) clips are planned in one place (src/autoreels/cloud/plan.py):
# windows cut in the silence between the boundary words (speech map), shots by the spec rule,
# ending = last word + end_air_sec. The snap/padding/repair/filler/tail stages are skipped for them.
manual_plan: true
# M2.1: planned clips are cut by the forced alignment (arl align <stem> → transcripts/<stem>.align.json):
# exact word times from the audio + untranscribed speech (fillers). --apply refuses without it.
require_alignment: true
# Close shot after a seam (REEL_SPEC §3): first sentence(s), at least / at most this many seconds.
accent_min_sec: 3.0
accent_max_sec: 8.0
# M2.2: the clip should end where the VOICE ends (arl prosody <stem> → transcripts/<stem>.prosody.json).
# --apply reports an ending whose voice stays up (sounds unfinished) and names finished sentence ends
# nearby; the review export marks such sentences with ↗. Thresholds: src/autoreels/local/prosody.py.
intonation_check: true
# REEL_SPEC §1.4: inside a planned clip, cut fillers («э», «ммм» — untranscribed speech from arl align)
# and over-long pauses between words, keeping a short pause; cut edges never inside a word.
# Per clip: review marker f:1 / f:0 > arl blocks --apply … --filler / --no-filler > this default.
# On by default since M32 (owner: «звук стал лучше»); needs the motion track (arl motion <stem>) —
# without it the cut is switched off with a warning.
manual_filler_cut: true
# Balance between a tighter clip and a calm picture (owner M30/M30b: a cut every ~2 s → «лицо дёргается»,
# every cut checked for a jump → almost nothing cut). jump_max: a cut whose face jump exceeds this × the
# typical motion is left in (or, with jump_mask, kept and masked by a wide↔close switch);
# min_cut_spacing_sec: cuts at least this far apart. Pick per run: arl blocks --apply … --filler-profile NAME.
manual_filler_profile: balance
# M79 — owner on PXL_20260729_copy r07: «интервьюер зависает между слов на несколько секунд (думает), можно сократить».
# A pause at least this long is always shortened (to the profile's kept pause); a visible face jump is masked by a
# wide↔close switch, and the spacing rules do not hold it back. 0 = off.
long_pause_sec: 1.5
manual_filler_profiles:
  careful: {jump_max: 3.5, min_cut_spacing_sec: 4.0, jump_mask: false}
  balance: {jump_max: 5.0, min_cut_spacing_sec: 3.0, jump_mask: false}
  dynamic: {jump_max: 3.5, min_cut_spacing_sec: 2.5, jump_mask: true}
  # balance + a visible jump that removes a sound («мм», «аа») is masked by a wide↔close switch, but
  # only ≥ 4 s from any other shot change (owner M31: dynamic — «где-то резкая смена, где-то хорошо»).
  balance_plus: {jump_max: 5.0, min_cut_spacing_sec: 3.0, jump_mask: true, mask_min_gap_sec: 4.0, mask_filler_only: true}
  # M70: montage clips (montage.filler_profile) — tempo without a twitching face: long pauses and «э/мм» only, jumps masked
  # M72 (owner on m70-tempo: «изредка — норм, много раз подряд — сильно заметно, слушается норм»): every cut at least
  # change_gap_sec from any other picture change (seam, shot switch, cut) — tempo without bursts of jumps
  montage_tempo: {pause_max_sec: 0.6, keep_sentence_sec: 0.3, min_cut_spacing_sec: 3.0, jump_max: 5.0, jump_mask: true, mask_min_gap_sec: 3.0, max_removed_share: 0.3, change_gap_sec: 6.0}

# arl label <source>: the LLM drafts review lines (s:/e:/x:/c:/k:/t:/d:), code maps them to the review
# numbering, checks REEL_SPEC (start/end by voice, unfinished text, length) and asks once for a repair.
# Output: reviews/<stem>_auto.txt — a draft the owner edits and applies with --labeler auto.
label:
  system: prompts/label_system.md
  fewshot: prompts/label_fewshot.json   # the owner's approved clips of all sources (arl fewshot-build)
  window_blocks: 6        # blocks per request (~5k tokens with the prompt; Groq free: 8000/min);
                          # windows overlap by max_clip_blocks-1 so a 3-block thought is seen whole
                          # (M39: 6 → every block is sent 1.5×, was 2× with 4)
  min_sec: 20             # played speech of a proposed clip
  max_sec: 90
  max_clip_blocks: 3      # one review line merges at most 3 blocks ('++')
  title_max_chars: 60
  repair_rounds: 1        # broken clips are sent back once with the reasons; still broken → '#!' line
  min_speech_share: 0.6   # M39: speech under 60% of a clip's time = guided practice / silences, not a reel
                          # (owner's clips IMG_6848: 0.8–0.9; 10h59 meditation blocks: 0.3–0.55)
  interview: prompts/label_interview.md   # added to the system prompt for source_kind interview
  rank: true              # finished draft → one request ranks its clips; score = place (95 … 65)
  fewshot_examples: 2     # M41: examples = the owner's approved clips of OTHER sources (arl fewshot-build)

# M40: local model for the labeller (llama.cpp `llama-server` on the Ubuntu machine, Vulkan, RX 580).
# Used only when LOCAL_LLM_URL is set in .env (machine-local, not in git), e.g.
#   LOCAL_LLM_URL=http://192.168.1.50:8080/v1
# arl label --llm auto (default): local first, cloud as fallback; --llm local / --llm cloud.
# The automatic R0 path never uses it.
local_llm:
  model: local            # llama-server serves one model; the name is only a label
  timeout_sec: 540        # one window takes minutes on an RX 580 (must stay under the pool's 600 s)
  max_output_tokens: 1500
  no_think: true          # Qwen3: no reasoning block (faster, same JSON)

# M108: one lock for every heavy job of gamebox (the audiobook's synthesis and checks, llama-server use, whisper.cpp):
# flock on one file there, the second comer waits — nobody kills the other's work. Taken when the local model or
# whisper.cpp on gamebox is used; llama-server is started when it is down and stopped again when autoreels started it.
heavy_lock:
  host: gamebox           # "" = off
  path: /mnt/data/locks/heavy.lock
  llama_unit: llama-server
  start_llama: true
  stop_if_started: true
  ready_timeout_sec: 600

# M50: montage — one clip from pieces of different blocks of a source (docs/REEL_SPEC.md §8).
# A draft line «M 85 | 13.2-6 41.1-4 | h:41.3 | t: …» plays block 13 sentences 2–6, then block 41
# sentences 1–4 (pieces in source order). Every seam between pieces: a shot change + a natural pause.
montage:
  enabled: true
  seam_pad_sec: 0.20      # air on each side of a seam between pieces (inside the silence; ≤ 0.4 s pause heard)
  piece_min_sec: 6.0      # a shorter piece is reported (the viewer has no time to settle)
  seams_per_min_max: 3.0  # more seams per minute of clip is reported (feels like constant jumping)
  pace_ratio_max: 1.35    # two joined pieces whose speech rate differs more are reported
  seam_jump_warn: 3.0     # picture jump at a seam (arl motion) above this × typical motion is reported
  loudness_diff_db: 4.0   # speech level (dB) on the two sides of a seam differs more → reported (heard as a jump)
  pitch_diff_st: 3.0      # median voice pitch on the two sides differs more (semitones) → reported (another mood)
  side_sec: 4.0           # loudness and pitch are measured on this much played speech on each side of a seam
  # M53 attention: the picture changes at least every max_static_sec (a wide↔close switch at a keyword k:,
  # else at a sentence or word boundary; no shot shorter than min_shot_sec); k: words are highlighted in the
  # subtitles of montage clips (render.yaml subtitle_keywords stays as it is for the other clips).
  # M53c — owner: «каждые 6 с наплыв — часто; наплыв нужен на важном или на стыке». The timed switch is off;
  # the close shot comes on a keyword k: (to the end of its sentence) and at the seams.
  max_static_sec: null
  min_shot_sec: 3.0
  keywords: true
  emphasis: true          # close shot on a k: keyword, to the end of its sentence (at least min_shot_sec)
  # M53b (owner on the 5 montage reels: «сильно дёргается» — the pause/filler cuts): a montage clip keeps its
  # pauses; its picture already changes with every shot switch. Per line f:1, or --filler, turns the cut back on.
  filler_cut: true          # M72: on — with the montage_tempo profile below (owner: occasional jump fine, bursts not)
  # M70 tempo: when a montage clip's filler cut is on (f:1 / --filler), this profile is used (--filler-profile wins):
  # only pauses over 0.6 s and «э/мм» go; a cut with a visible face jump is masked by a wide↔close switch, at most one
  # change every 3 s, else left in. A/B: arl blocks --apply <draft> --filler vs without.
  filler_profile: montage_tempo
  # M58: a piece that goes straight on from the previous one in the source (next sentence, or sentence 1 of the
  # next block right after the last one) is played as one piece — no seam. x1, x2… name the filtered blocks.
  join_gap_sec: 2.0
  # M74 — owner: «после крючка сильно резко идёт тело»: up to this much real silence after the cold open and before
  # the body's first word (never into speech) — the hook and the start of the clip are heard as two things. 0 = off.
  hook_air_sec: 0.5
  # M77 — owner on PXL_20260729_copy: «не хватает динамики» (11 of 16 reels were ordinary clips without these effects):
  fx_auto_clips: true     # the fx below (not callouts) also on ordinary clips of an auto draft; owner-labelled clips unchanged
  # M55 — owner: «давай пробовать все» (attention effects of montage clips; each switch off = as before):
  fx:
    push: true              # slow push-in on every shot of at least push_min_sec, push_pct % closer by its end
    push_pct: 4.0
    push_min_sec: 6.0
    karaoke: true           # subtitles light up word by word (subtitles.yaml karaoke_color)
    progress: true          # thin bar along the bottom edge filling over the clip
    whoosh: true            # soft whoosh under every seam between pieces
    whoosh_volume: 0.25
    callouts: true          # o:B.N=Текст on a montage line → the text in big letters for callout_sec
    callout_numbers: true   # … plus the numbers said in the clip («3 года»), at most callout_numbers_max
    callout_numbers_max: 3
    callout_gap_sec: 8.0    # no two callouts closer than this
    callout_sec: 2.0
    pop: true               # M70: the clip opens pop_pct % closer and eases back to the frame over pop_sec (sharp start)
    pop_pct: 8.0
    pop_sec: 0.6
    plate_after_hook: true  # M74: the plate t: appears when the body starts (after the cold open), not over the hook

# M56: arl autocut <stem> — montage lines proposed from the map (transcripts/<stem>.map.json) → reviews/<stem>_auto_m56.txt.
# A clip grows around a strong thought (punch ≥ seed_punch), takes what it leans on and thoughts of the same topic
# (and its «similar» elsewhere), a question opens it, a payoff ends it; t:/d: are the map's summaries.
autocut:
  clips: 5
  min_sec: 25             # shorter clips are not proposed
  target_sec: 45          # a clip stops growing here … (M65: 60 → 45 — reels that hold attention are short)
  max_sec: 65             # … and never goes past this (M65: 90 → 65)
  max_pieces: 4           # at most this many pieces (adjacent thoughts join without a seam)
  min_punch: 3            # weaker thoughts are never used
  seed_punch: 4           # a clip grows only around a thought at least this strong
  hook_min_words: 4       # the cold open h: — a finished sentence of at least 4 words, ≤ hook_max_sec
  overlap_max: 0.5        # a clip sharing more than half its thoughts with a better one is dropped
  use_filtered: false     # thoughts of filtered blocks (head, tail, promo) are not used
  check_pool: 3           # M60: up to clips × 3 candidates, each run through the --apply checks; failures are replaced
  max_shared: 0           # M68: accepted clips share no thought and never open on the same one (11h42: two reels
                          # opened on «Вы не сломаны…»); a candidate too close to an accepted one is skipped unchecked
  # M70 — owner: «берём 2, 4, 6» (first 3 seconds, seams, tempo):
  hook_title: true        # the model proposes a curiosity headline for the plate t: — kept only when it stays in the
                          # clip's words (≤ 60 chars, ≤ 9 words, no new numbers, content words from the clip)
  seam_check: true        # the model judges every seam (B continues A?); a clip with a jarring seam goes behind clean ones
  short_variant: false    # M78 off (owner: IMG r03 and r06 open on the same phrase — a short version keeps the start)
                          # — on: every accepted clip also gets a short version (weakest middle thoughts dropped)
  short_sec: 25
  short_min_sec: 15
  # M74 — owner: «начала дают мало контекста ("и второй момент, как я уже говорил…")»:
  context_start: true     # the first sentence after the hook stands on its own: a short leaning sentence is dropped,
                          # else the thought right before is added as context, else that opening thought goes, else no clip
  context_max_sec: 15     # … the added context thought at most this long
  context_drop_words: 5   # … a leaning first sentence of at most this many words may be dropped
  plate: context          # the plate t: says what the clip is about (the hook already pulls) — hook = M71/M73 headline
  plate_hookless: hook    # M112: a clip with no cold open opens on its plate — there it is the M71/M73 curiosity headline
                          # (a question to the viewer, a claim to «вы», a contrast — in the clip's words); "" = as plate
  # M75 (M74 report: «Уйти.», «Контролер, да, допустим.», «Хоть это…»; 6 of 15 clips with no pause after the hook):
  context_min_words: 4    # a start shorter than this (not a question) is a fragment — fixed like a leaning one
  context_judge: true     # the model says whether a first sentence stands on its own (rules first; no answer = rules)
  hook_pause_sec: 0.25    # the hook has no silence after it in the recording → the next of the model's top hooks that has
  hook_pause_top: 3       # at least this much (montage.hook_air_sec), among its first hook_pause_top; else the first stays
  # M76 (M75 report: 11h42 4 → 2 clips, Pxl 5 → 3 — starts that could be repaired were dropped):
  context_back: 2         # the context may be the two thoughts right before (when the nearest leans back itself)
  context_later: false    # M77 off (owner: «"перенос — вещь неблагодарная" — непонятно»: the dropped sentences carried
  context_later_min_sec: 8   # the context) — else the clip would start at a later sentence of its first thought
  # M81 — owner: IMG r03/r06 «начинаются с фразы про кресло, она малоинформативна» (the cold open, heard before the start):
  hook_judge: true        # the cold open passes the start's model check (subject, makes sense alone, leads into the clip)
  hook_judge_top: 6       # … the first 6 candidates are judged; a rejected one goes before ranking; none passes = no cold open
  # M83 — m80 hooks: all 5 cold opens were the clip's own first sentence (no teaser; the body went on «В инстинкты.»):
  hook_teaser: true       # the cold open is a line from the second half of the clip (a teaser), replayed in its place (h:B.N!)
  hook_teaser_pos: 0.5    # … it starts at least this far into the clip's sentences; none there = no cold open
  hook_no_pointer: true   # M92 (m86: the model passed «Это и есть доверие к себе», «Но опять…», «Он как-то хочет…»): a teaser
                          # that points back — a first «Это/Но/Он/Вот…», «это» among the first 3 words — is left out by the code
  hookless_last: true     # M107 (m106: 6 of 15 clips had no cold open — few sentences in the second half, most pointing
                          # back): a clip left without one goes after every clip with one; taken only when those run out
  # M86 — M85: strong lines («И никогда, ребятки, не поздно.») rejected for leaving a question open; 11h42 lost a clip when
  # the model answered a borderline start differently than in m78:
  hook_judge_mode: teaser # the cold open is judged as a teaser: an open question or a punchline is fine, a pointer back is not;
                          # the model sees the words of the clip's ending (what the teaser promises)
  owner_examples: 6       # the latest 6 cold opens / starts the owner rejected (reason крючок / начало) and kept — examples
                          # in the judges' prompts (reviews/verdicts.jsonl, M82)
  judge_cache: true       # the judges' answers kept between runs (data/cache/autocut_judge.json; delete it to ask again)
  # M88 — owner: «у копии PXL не хватает динамики»; k: words were only in the owner's own lines:
  keywords: true          # the model marks key words (k:): highlighted in the subtitles, the close shot comes on them
  keywords_every_sec: 12  # one per 12 s of the clip …
  keywords_max: 4         # … at most 4 (each one is also a shot change — «наплыв только на важном»)
  # M91 — ending package (PLAN M1.7 B), the part that fits the owner's rules (no frozen frame, quick ending):
  close_last: true        # the payoff — the clip's last sentences (≥ 3 s, at most two) — in the close shot (c:)
  close_last_sec: 3
  # M65 — owner: «наша цель — интересные, цепляющие ролики»:
  loop: true              # a question the clip answers opens it (from anywhere; the answer is the payoff at the end)
  loop_max_sec: 20        # … a question thought at most this long
  prune: true             # the weakest middle thoughts go while the clip is longer than target_sec + prune_slack
  prune_slack: 8
  hook_min_sec: 1.5       # hook candidates: finished sentences 1.5 s … hook_max_sec, scored (question, contrast, number,
                          # «вы», strong words, voice energy, strength; leaning back «И…/Это…» scores low)
  hook_llm: auto          # the model picks the best of the top 6 hook candidates (auto | cloud | local | none)
  speed_slow_rate: 2.3    # speech slower than 2.3 words/s → @1.08
  speed_slow: 1.08
  speed_mid_rate: 2.6     # … slower than 2.6 → @1.05; faster — no speed-up
  speed_mid: 1.05

# M57: arl tx-check — Whisper inventions and holes in a transcript (G5a: on IMG_6848 Groq wrote «Субтитры создавал
# DimaTorzok» and one phrase five times where the speaker said something else). Pointers for the ear; nothing is changed.
tx_check:
  enabled: true             # warn at --apply on a clip that plays a flagged place
  repeat_words: 6           # the same 6+ words …
  repeat_far_sec: 60        # … again at least 60 s away
  sparse_win_sec: 10        # «sound without words»: a 10 s window …
  sparse_min_speech_sec: 6  # … where the speech map hears at least 6 s of speech …
  sparse_max_rate: 0.8      # … but the transcript has fewer than 0.8 words per second of it
  known: []                 # extra known inventions (the built-in list is in cloud/txcheck.py)
  on_speech_sec: 2.0        # M60: a flagged place with ≥ 2 s of speech in [t−1, t+4] is «на речи» (hides what was said);
                            # one in silence is Whisper filling a pause — it only matters if a clip plays that pause
  sparse_suspicious_sec: 60 # M60: a transcript is suspicious with an invention on speech or ≥ 60 s of «sound without words»
  punct_chunk_words: 120    # M113: arl tx-punct --by llm — words the model sees at once (it answers with numbers: small output)

# M54: arl map <stem> — the map of a whole source (transcripts/<stem>.map.json + reels-out/<stem>/_map.html):
# thoughts (1–4 sentences), voice energy, role / strength / references / topic (LLM), similar thoughts far apart.
map:
  system: prompts/map_system.md
  unit_min_sec: 8         # a thought shorter than this takes the next sentence too …
  unit_max_sec: 30        # … but never grows past this
  unit_max_sents: 4
  pause_split_sec: 1.0    # a pause this long after a finished sentence ends a thought
  window_units: 8         # thoughts per LLM request (M54b: 20 overflowed max_output_tokens 900 — passports cut off)
  similar_min: 0.30       # character-n-gram cosine from which two thoughts count as similar
  similar_far_sec: 60     # similar thoughts are listed only when at least this far apart
  max_missing: 0.1        # M66: more than this share of thoughts without a passport (or no topics) → the map is
                          # incomplete: arl map returns 3, auto stops on «map», autocut refuses; arl map again
                          # asks only what is missing (10h59 local-gp: Groq out of tokens, 144 of 152 → 0 clips)
  topic_chunk: 50         # M84 (G7: the topics request over a whole long source timed out): more thoughts → topics are
                          # asked in parts of consecutive thoughts (≤ 50 each, retried once), then one merge request

# M1.6 stage 2: deterministic pre-filter — drops obviously-not-a-clip blocks before LLM sees them.
# Every dropped block goes to a .blocks.dropped.json sidecar with its reason and first 8 words.
# A filter that removes a good block is worse than one that lets junk through (stage 3 can rank it down).
blocks_filter:
  head_skip_sec: 30       # drop blocks whose midpoint falls in the first N seconds (greetings)
  tail_skip_sec: 30       # drop blocks whose midpoint falls in the last N seconds (sign-offs)
  speech_density_min: 0.4 # drop if spoken_words_time / wall_time < threshold (guided practice silences)
  repetition_unique_ratio_min: 0.3  # drop if unique_words/total_words < threshold (Whisper loops)
  artefact_markers:       # case-insensitive substrings that identify Whisper training-data hallucinations
    - "субтитры создавал"
    - "субтитры созданы"   # variant found in PXL: "Субтитры созданы сообществом Авиакатастроф"
    - "субтитры сделал"
    - "редактор субтитров"
    - "続きは"            # Japanese credit string Whisper sometimes hallucinates
    - "字幕"              # Chinese subtitle credit
  promo_keywords:         # organisational / promotional talk — case-insensitive substring match
    - "приходите на"      # street addresses ("приходите на Фурмановскую")
    - "перерыв"
    - "включите звук"
    - "слышно меня"
    - "запись идёт"
    - "подписывайтесь"
  # Price pattern (\d+\s*рубл) is matched by code — no need to list here.
  signoff_phrases:        # dropped when phrase opens a sentence (block start or after .!?…)
    - "спасибо, что были"
    - "спасибо за внимание"
    - "до встречи"
    - "всем пока"
    - "на этом всё"
    - "до новых встреч"
    - "здравствуйте"
    - "добрый день"
    - "рад вас видеть"
    - "давайте начнём"

# M1.6 stage 3: heuristic pre-scoring. Weights are tunable; final model verdict still wins.
# A filter that buries a good block is worse than one that lets junk through — tune conservatively.
block_scoring:
  w_duration: 20.0        # bell-curve peak inside sweet_spot_min..sweet_spot_max
  w_ends_sentence: 10.0   # block ends on terminal punctuation
  w_opens_sentence: 10.0  # first word is not a dangling opener
  w_question: 8.0         # block contains an interrogative sentence
  w_contrarian: 12.0      # block contains a hook/contrarian marker
  w_lexical: 8.0          # lexical richness: unique_words / total_words
  w_dangling: 10.0        # penalty: many pronouns/demonstratives in first sentence
  w_speaker_change: 20.0  # penalty: has_internal_speaker_change
  w_density_penalty: 8.0  # penalty: speech density < 0.5 (near-silence); >0.95 is normal speech
  min_sec: 18.0           # score = 0 at and below this (matches min_meaningful_sec)
  sweet_spot_min: 30.0    # duration ramp reaches 1.0 here
  sweet_spot_max: 60.0    # starts falling off; hits 0 at sweet_max + (sweet_max - sweet_min)
  top_k_per_chunk: 8      # keep this many blocks per time window
  chunk_window_sec: 300.0 # time window size for per-chunk top-K filtering (≈5 min)
  contrarian_markers:
    - "на самом деле"
    - "наоборот"
    - "а вот и нет"
    - "что интересно"
    - "однако"
    - "но дело в том"
    - "интересно то"
    - "всё дело в"
    - "парадокс в том"
    - "на самом же деле"
  bad_open_words:         # conjunctions + pronouns + demonstratives that signal dangling context
    # "а" excluded: Russian host-question opener "А когда/А бывало ли" is a valid standalone start
    - "и"
    - "из"
    - "но"
    - "или"
    - "поэтому"
    - "потому"
    - "однако"
    - "ведь"
    - "значит"
    - "тоже"
    - "также"
    - "зато"
    - "впрочем"
    - "итак"
    - "следовательно"
    - "таким"
    - "он"
    - "она"
    - "они"
    - "оно"
    - "его"
    - "её"
    - "их"
    - "им"
    - "ей"
    - "тот"
    - "та"
    - "те"
    - "этот"
    - "эта"
    - "эти"
    - "этим"
  # 3rd-person pronouns and demonstratives for dangling_reference density check only
  # (conjunctions excluded — they appear normally mid-sentence and inflate the ratio)
  dangling_pronouns:
    - "он"
    - "она"
    - "они"
    - "оно"
    - "его"
    - "её"
    - "их"
    - "им"
    - "ей"
    - "тот"
    - "та"
    - "те"
    - "этот"
    - "эта"
    - "эти"
    - "этим"

# Пути к рантайм-промптам R0 (не хардкод в коде — берутся отсюда).
prompts:
  system: prompts/r0_system.md
  fewshot: prompts/r0_fewshot.json

# Чанкинг: Whisper-чанкинг аудио + R0-чанкинг транскрипта. Оба реализованы и работают.
chunking:
  enabled: true
  whisper_chunk_duration_sec: 600      # 10 мин на чанк
  whisper_threshold_minutes: 15        # порог «чанкить» по длительности
  whisper_threshold_bytes: 20971520    # 20 МБ — второй гард по размеру аудио
  silence_window_sec: 30               # окно VAD поиска тишины вокруг target-границы (±сек)
  silence_threshold_db: -40            # порог silencedetect
  r0_chunk_tokens: 1200                # токены на R0-чанк транскрипта. НАМЕРЕННО МЕЛКО — это не
                                       # экономия входа: при OTPM=1000 ответ обрезан примерно на
                                       # трёх моментах, поэтому урожай определяется ЧИСЛОМ
                                       # запросов, а не размером чанка. Крупные чанки = те же
                                       # 3 момента с бо́льшего куска речи = меньше клипов
                                       # (проверено: 4000 → 4 рилса, 1200 → 7 на той же лекции).
                                       # Вход (8000 TPM) ограничением НЕ является: пробник прошёл
                                       # prompt 4700 + max_tokens 8192.
                                       # После перехода на платный тир поднимать вместе с
                                       # max_output_tokens.
  r0_overlap_tokens: 300               # перекрытие R0-чанков (≈60с речи)
  r0_chunk_delay_sec: 2.0              # пауза между R0-чанками; темп сверх этого держит пейсер
                                       # по заголовкам x-ratelimit-*
  dedup_overlap_ratio: 0.6             # порог дедупа рилов из разных R0-чанков
  fail_fast: false                     # false → продолжать при провале одного чанка

# M94 — owner: «нужно делать подробное описание видео (для постинга)». arl describe <source> [--gate имя] writes
# <rid>.post.txt next to each rendered clip: the model's post (grounded in the reel's words — cloud/postcopy.py) and
# hashtags said in the reel, after render.yaml hashtags_always; arl crosspost takes it instead of <rid>.txt.
post:
  sentences_min: 3
  sentences_max: 5
  max_chars: 700
  hashtags: 3
  auto: true              # M112: arl auto writes the posts before the review sheet (they show on the cards); after the
                          # owner's verdicts arl export <source> --decisions <file> sends only the approved clips to crosspost

# M100 — longreads (v1.0 text content): arl article <source> → export/articles/<source>/NN.md and a crosspost plan
# export/crosspost/<source>_articles.csv (тип «статья», заголовок) for Telegraph. One article per topic of the map
# (the largest real topics); a plan, then every section written from its thoughts' words (cloud/article.py checks it).
article:
  topics: 3
  sections_min: 3
  sections_max: 5
  section_sentences_min: 2
  section_sentences_max: 8
  section_chars: 900
