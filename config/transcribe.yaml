# Транскрипция. backend выбирается отсюда; env TRANSCRIBE_BACKEND перебивает (ad-hoc).
# API-ключ (GROQ_API_KEY) — ТОЛЬКО в окружении/.env, никогда не здесь.
backend: groq                  # groq (дефолт, dev и prod) | faster_whisper | whispercpp (M62: gamebox)
language: ru                   # язык транскрипции

groq:
  model: whisper-large-v3      # word-level таймкосы обязательны (R1 snap, R3 субтитры)
  # Priming-текст: Whisper копирует пунктуационный стиль prompt. Русская разговорная
  # речь без него роняет точки/вопросы → пропадает sentence-путь snap'а (см.
  # docs/audit-punctuation.md). Слать в КАЖДЫЙ чанк. Пустая строка = не слать.
  #
  # ОГРАНИЧЕНИЕ: текст должен быть самодостаточным — НЕ начинаться как реплика
  # диктора (нет «я расскажу», «сейчас разберём», вопросов к аудитории). Незавершённый
  # нарратив Whisper дописывает в начало транскрипта — утечка промпта в субтитры.
  # Используйте нейтральные, завершённые предложения без первого лица.
  initial_prompt: >-
    Тема сегодняшней беседы — психология принятия решений. Специалисты выделяют
    несколько ключевых факторов. Каждый из них влияет на результат по-своему.

# Необязательный CPU-fallback (offline). НЕ дефолт: prod на AMD-GPU без CUDA → только CPU.
faster_whisper:
  model_size: large-v3
  device: cpu
  compute_type: int8

# M62: whisper.cpp на gamebox по ssh (backend: whispercpp или arl tx-compare). Пути — на gamebox;
# $W задаёт env. VAD: Whisper слышит только речь — не выдумывает в паузах. -mc 0: без подсказки
# прошлым текстом (повторы). Без initial_prompt: у Groq он протекал в текст (IMG_6848).
whispercpp:
  host: gamebox
  env: ~/llama.env
  cli: ~/whisper.cpp/build/bin/whisper-cli
  model: $W/ggml-large-v3-turbo.bin
  vad_model: $W/ggml-silero-v5.1.2.bin
  language: ru
  threads: 8
  max_context: 0
  extra_args: ""
  remote_dir: ~/autoreels_tx
  prompt: ""                # M64: подсказка стиля пунктуации (--prompt); "" = без неё. С VAD утечки реже, но проверяй tx-check
  prompt_context: 64        # M64b: с подсказкой и max_context 0 берётся -mc 64 (при -mc 0 whisper.cpp подсказку выбрасывает)
